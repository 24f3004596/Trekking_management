<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff — TrekManage</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="staff-theme">


<div class="topbar">
    <span>TrekManage — Staff Panel</span>
    <div class="nav-right">
        {% if staff_user %}
            <span style="font-size:13px; color:#aed6f1;">{{ staff_user.username }}</span>
        {% endif %}
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>
</div>

<div class="layout">
    <div class="sidebar">
        <a href="{{ url_for('staff.dashboard') }}">Dashboard</a>

        <a href="{{ url_for('staff.profile') }}">Profile</a>
    </div>

    <div class="main">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</div>

</body>
</html>
