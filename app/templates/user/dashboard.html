{% extends "base.html" %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-12">
        <h2 class="text-success fw-bold">Trekker Dashboard</h2>
        <p class="text-muted">Welcome! Start exploring and booking your next adventure.</p>
        <hr>
        
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card bg-white shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title text-dark">Find a Trek</h4>
                        <p class="card-text text-muted">Browse all open and approved treks.</p>
                        <a href="#" class="btn btn-outline-success btn-sm fw-bold">Search Treks</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-white shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title text-dark">My Bookings</h4>
                        <p class="card-text text-muted">View your upcoming and past trips.</p>
                        <a href="#" class="btn btn-outline-primary btn-sm fw-bold">View History</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
