{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Create an Account</h3>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label class="form-label text-muted">Username</label>
                        <input type="text" name="username" class="form-control" required placeholder="Choose a username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Email address</label>
                        <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">I am registering as a:</label>
                        <select name="role" id="role-select" class="form-select" onchange="toggleStaffFields()">
                            <option value="Trekker">User (Trekker)</option>
                            <option value="Staff">Trek Staff</option>
                        </select>
                    </div>
                    
                    <div class="mb-4 d-none" id="staff-fields">
                        <label class="form-label text-muted">Contact Details (Staff Only)</label>
                        <input type="text" name="contact_details" class="form-control" placeholder="Phone number or address">
                        <small class="text-danger mt-1">Note: Staff accounts require Admin approval before you can log in.</small>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Register</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>.</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleStaffFields() {
        const role = document.getElementById('role-select').value;
        const staffFields = document.getElementById('staff-fields');
        if (role === 'Staff') {
            staffFields.classList.remove('d-none');
        } else {
            staffFields.classList.add('d-none');
        }
    }
</script>
{% endblock %}
