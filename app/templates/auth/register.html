{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-box">
        <h1>Create an Account</h1>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Choose a username">

            <label>Email address</label>
            <input type="email" name="email" required placeholder="name@example.com">

            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter password">

            <label>I am registering as a:</label>
            <select name="role">
                <option value="Trekker">User (Trekker)</option>
                <option value="Staff">Trek Staff</option>
            </select>

            <label>Contact Details <span style="color:#888;">(Staff only — leave blank if Trekker)</span></label>
            <input type="text" name="contact_details" placeholder="Phone number or address">
            <p style="font-size:12px; color:#c0392b; margin-top:-8px; margin-bottom:12px;">
                Note: Staff accounts require Admin approval before you can log in.
            </p>

            <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:12px;">Register</button>
        </form>
        <p style="font-size:13px; color:#666; text-align:center;">
            Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>.
        </p>
    </div>
</div>
{% endblock %}
