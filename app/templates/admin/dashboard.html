{% extends "base.html" %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-12">
        <h2 class="text-danger fw-bold">Admin Dashboard</h2>
        <p class="text-muted">Welcome back, SuperAdmin! You have full access to the system.</p>
        <hr>
        
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card bg-primary text-white shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title">Manage Treks</h4>
                        <p class="card-text">Create, edit, or remove trekking routes.</p>
                        <a href="#" class="btn btn-light btn-sm text-primary fw-bold">Go to Treks</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title">Manage Users & Staff</h4>
                        <p class="card-text">Approve staff or blacklist users.</p>
                        <a href="#" class="btn btn-light btn-sm text-success fw-bold">Go to Users</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
