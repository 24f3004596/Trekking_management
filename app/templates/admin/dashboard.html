{% extends 'admin/admin_base.html' %}

{% block content %}
<h1>Dashboard</h1>

<div class="card-row">
    <div class="card">
        <div class="number">{{ total_treks }}</div>
        <div class="label">Total Treks</div>
    </div>
    <div class="card">
        <div class="number">{{ total_users }}</div>
        <div class="label">Trekkers</div>
    </div>
    <div class="card">
        <div class="number">{{ total_staff }}</div>
        <div class="label">Staff Members</div>
    </div>
    <div class="card">
        <div class="number">{{ total_bookings }}</div>
        <div class="label">Bookings</div>
    </div>
</div>

<h2>Quick Links</h2>
<p>
    <a class="btn btn-primary" href="{{ url_for('admin.treks') }}">Manage Treks</a>
    <a class="btn btn-secondary" href="{{ url_for('admin.staff') }}">Manage Staff</a>
    <a class="btn btn-secondary" href="{{ url_for('admin.users') }}">Manage Users</a>
    <a class="btn btn-secondary" href="{{ url_for('admin.bookings') }}">View Bookings</a>
</p>
{% endblock %}
