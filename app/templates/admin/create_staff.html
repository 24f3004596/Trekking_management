{% extends 'admin/admin_base.html' %}

{% block content %}
<h1>Create Staff Account</h1>

<div class="form-wrap">
    <form method="POST" action="{{ url_for('admin.create_staff') }}">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Choose a username">

        <label>Email address</label>
        <input type="email" name="email" required placeholder="name@example.com">

        <label>Password</label>
        <input type="password" name="password" required placeholder="Set initial password">

        <label>Contact Details <span style="color:#888;">(optional)</span></label>
        <input type="text" name="contact_details" placeholder="Phone number or address">

        <p style="font-size:12px; color:#555; margin-bottom:14px;">
            The account will be created with <strong>Approved</strong> status — the staff member can log in immediately.
        </p>

        <button type="submit" class="btn btn-success">Create Staff Account</button>
        <a class="btn btn-secondary" href="{{ url_for('admin.staff') }}" style="margin-left:8px;">Cancel</a>
    </form>
</div>
{% endblock %}
