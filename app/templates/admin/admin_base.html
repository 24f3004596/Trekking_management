<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — TrekManage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; font-size: 14px; background: #f4f4f4; color: #222; }

        /* Top bar */
        .topbar {
            background: #2c3e50;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar a { color: #aaa; text-decoration: none; font-size: 13px; }
        .topbar a:hover { color: #fff; }

        /* Layout */
        .layout { display: flex; min-height: calc(100vh - 42px); }

        /* Sidebar */
        .sidebar {
            width: 190px;
            background: #34495e;
            padding: 16px 0;
            flex-shrink: 0;
        }
        .sidebar a {
            display: block;
            padding: 10px 20px;
            color: #ccc;
            text-decoration: none;
            font-size: 13px;
        }
        .sidebar a:hover, .sidebar a.active { background: #2c3e50; color: #fff; }
        .sidebar .section-title {
            padding: 12px 20px 4px;
            color: #7f8c8d;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main content */
        .main {
            flex: 1;
            padding: 20px;
        }

        /* Flash messages */
        .flash { padding: 8px 12px; margin-bottom: 12px; border-left: 4px solid; font-size: 13px; }
        .flash.success { background: #d4edda; border-color: #27ae60; color: #155724; }
        .flash.danger  { background: #f8d7da; border-color: #e74c3c; color: #721c24; }
        .flash.warning { background: #fff3cd; border-color: #f39c12; color: #856404; }
        .flash.info    { background: #d1ecf1; border-color: #17a2b8; color: #0c5460; }

        /* Page title */
        h1 { font-size: 20px; margin-bottom: 16px; color: #2c3e50; }
        h2 { font-size: 16px; margin-bottom: 12px; color: #2c3e50; }

        /* Cards */
        .card-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 16px 20px;
            min-width: 140px;
            text-align: center;
        }
        .card .number { font-size: 28px; font-weight: bold; color: #2980b9; }
        .card .label  { font-size: 12px; color: #666; margin-top: 4px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
        th, td { padding: 8px 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #2c3e50; color: #fff; font-weight: normal; }
        tr:nth-child(even) { background: #f9f9f9; }

        /* Forms */
        .form-wrap { background: #fff; border: 1px solid #ddd; padding: 20px; max-width: 500px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; color: #444; }
        input[type=text], input[type=date], input[type=number], input[type=email],
        input[type=password], select, textarea {
            width: 100%; padding: 6px 8px; border: 1px solid #ccc;
            border-radius: 3px; margin-bottom: 12px; font-size: 13px;
        }
        .btn {
            display: inline-block;
            padding: 6px 14px;
            font-size: 13px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }
        .btn-primary { background: #2980b9; }
        .btn-success { background: #27ae60; }
        .btn-warning { background: #e67e22; }
        .btn-danger  { background: #e74c3c; }
        .btn-secondary { background: #7f8c8d; }
        .btn:hover { opacity: 0.88; }

        /* Search form */
        .search-form { display: flex; gap: 6px; margin-bottom: 14px; }
        .search-form input { width: 220px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; }

        /* Inline form */
        .inline-form { display: inline; }

        /* Badge */
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 11px; font-weight: bold;
        }
        .badge-green  { background: #d4edda; color: #155724; }
        .badge-yellow { background: #fff3cd; color: #856404; }
        .badge-red    { background: #f8d7da; color: #721c24; }
        .badge-blue   { background: #d1ecf1; color: #0c5460; }
        .badge-grey   { background: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

<div class="topbar">
    <strong>🏔️ TrekManage — Admin Panel</strong>
    <a href="{{ url_for('auth.logout') }}">Logout</a>
</div>

<div class="layout">
    <div class="sidebar">
        <div class="section-title">Overview</div>
        <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>

        <div class="section-title">Treks</div>
        <a href="{{ url_for('admin.treks') }}">All Treks</a>
        <a href="{{ url_for('admin.add_trek') }}">Add Trek</a>

        <div class="section-title">People</div>
        <a href="{{ url_for('admin.staff') }}">Staff</a>
        <a href="{{ url_for('admin.users') }}">Users</a>

        <div class="section-title">Bookings</div>
        <a href="{{ url_for('admin.bookings') }}">All Bookings</a>
    </div>

    <div class="main">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</div>

</body>
</html>
